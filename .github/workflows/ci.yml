name: CI

on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**', 'prd/**']
  pull_request:
    branches: [main]

jobs:
  # ── iOS simulator build (no signing required) ─────────────────────────────
  ios-build:
    name: iOS build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Resolve Swift packages
        working-directory: ios
        run: xcodegen generate

      - name: Resolve Swift packages
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Sol.xcodeproj \
            -scheme Sol \
            -clonedSourcePackagesDirPath .spm-cache

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project Sol.xcodeproj \
            -scheme Sol \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || xcodebuild build \
              -project Sol.xcodeproj \
              -scheme Sol \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO

  # ── Daemon unit tests ─────────────────────────────────────────────────────
  daemon-tests:
    name: Daemon tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daemon/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: PYTHONPATH=. pytest daemon/tests/ -v
