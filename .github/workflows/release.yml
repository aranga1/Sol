name: Release

on:
  push:
    tags: ['v*']

jobs:
  # ── Package daemon + setup scripts ────────────────────────────────────────
  package-daemon:
    name: Package daemon & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package daemon
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf sol-daemon-${VERSION}.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' \
            --exclude='venv' --exclude='*.log' \
            daemon/
          echo "DAEMON_PKG=sol-daemon-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Package setup scripts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf sol-setup-${VERSION}.tar.gz setup/
          echo "SETUP_PKG=sol-setup-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            sol-daemon-*.tar.gz
            sol-setup-*.tar.gz

  # ── Build signed IPA ──────────────────────────────────────────────────────
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    # Skip if signing secrets are not configured
    if: >
      vars.SKIP_IPA_BUILD != 'true' &&
      secrets.APPLE_CERT_BASE64 != ''
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install xcodegen
        run: brew install xcodegen && cd ios && xcodegen generate

      - name: Import signing certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/sol.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/Sol.mobileprovision

      - name: Build archive
        run: |
          xcodebuild archive \
            -project ios/Sol.xcodeproj \
            -scheme Sol \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Sol.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Sol.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/Sol.ipa

  # ── Create GitHub release ─────────────────────────────────────────────────
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [package-daemon]
    # build-ipa is optional — release proceeds even if IPA job was skipped
    if: always() && needs.package-daemon.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Download IPA (if built)
        uses: actions/download-artifact@v4
        with:
          name: ipa
          path: dist/
        continue-on-error: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          FILES=$(ls dist/)
          gh release create "$VERSION" dist/* \
            --title "Sol ${VERSION}" \
            --notes "$(cat << 'EOF'
          ## Sol ${VERSION}

          ### What's included
          | Asset | Description |
          |-------|-------------|
          | `sol-daemon-*.tar.gz` | Python daemon — extract and run via \`install.sh\` |
          | `sol-setup-*.tar.gz` | Setup scripts (install.sh, sol_cli.py, qr_generate.py) |
          | `Sol.ipa` _(if present)_ | iOS app — install on registered development devices |

          ### Install
          \`\`\`bash
          curl -L https://raw.githubusercontent.com/aranga1/Sol/main/setup/install.sh | bash
          \`\`\`

          ### iOS app
          The IPA is signed for development. It installs on devices registered to the
          developer account. Sideload via \`xcrun devicectl device install app\` or
          configure TestFlight (issue #42) for broader distribution.
          EOF
          )"
