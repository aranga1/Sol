name: Release

on:
  push:
    tags: ['v*']

jobs:
  # ── Package daemon + setup scripts ────────────────────────────────────────
  package-daemon:
    name: Package daemon & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package daemon
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf sol-daemon-${VERSION}.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.env' \
            --exclude='venv' --exclude='*.log' \
            daemon/
          echo "DAEMON_PKG=sol-daemon-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Package setup scripts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf sol-setup-${VERSION}.tar.gz setup/
          echo "SETUP_PKG=sol-setup-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            sol-daemon-*.tar.gz
            sol-setup-*.tar.gz

  # ── Build signed IPA ──────────────────────────────────────────────────────
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-15
    if: vars.SKIP_IPA_BUILD != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install xcodegen
        run: brew install xcodegen && cd ios && xcodegen generate

      - name: Initialize Xcode platforms
        run: |
          sudo xcodebuild -runFirstLaunch
          defaults write com.apple.dt.Xcode DVTSkipDeviceSupportCheck YES

      - name: Import signing certificate
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/sol.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/Sol.mobileprovision
          PROFILE_UUID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/Sol.mobileprovision \
            | plutil -extract UUID raw -)
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Build archive
        run: |
          xcodebuild archive \
            -project ios/Sol.xcodeproj \
            -scheme Sol \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Sol.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            "EXCLUDED_ARCHS[sdk=iphonesimulator*]=arm64 x86_64"

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Sol.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/Sol.ipa \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/Sol.ipa

  # ── Create GitHub release ─────────────────────────────────────────────────
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [package-daemon]
    # build-ipa is optional — release proceeds even if IPA job was skipped
    if: always() && needs.package-daemon.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Download IPA (if built)
        uses: actions/download-artifact@v4
        with:
          name: ipa
          path: dist/
        continue-on-error: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          FILES=$(ls dist/)
          gh release create "$VERSION" dist/* \
            --title "Sol ${VERSION}" \
            --notes "$(cat << 'EOF'
          ## Sol ${VERSION}

          ### What's included
          | Asset | Description |
          |-------|-------------|
          | `sol-daemon-*.tar.gz` | Python daemon — extract and run via \`install.sh\` |
          | `sol-setup-*.tar.gz` | Setup scripts (install.sh, sol_cli.py, qr_generate.py) |
          | `Sol.ipa` _(if present)_ | iOS app — also uploaded to TestFlight automatically |

          ### Install
          \`\`\`bash
          curl -L https://raw.githubusercontent.com/aranga1/Sol/main/setup/install.sh | bash
          \`\`\`

          ### iOS app
          The iOS build is submitted to TestFlight automatically on each release tag.
          Install via the TestFlight app once Apple's processing completes (usually ~10 min).
          EOF
          )"
