name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Inject beta dispatch token
        env:
          GH_BETA_DISPATCH_TOKEN: ${{ secrets.GH_BETA_DISPATCH_TOKEN }}
        run: |
          python3 -c "
          import os, pathlib
          p = pathlib.Path('docs/beta.html')
          p.write_text(p.read_text().replace('__DISPATCH_TOKEN__', os.environ['GH_BETA_DISPATCH_TOKEN']))
          "

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - uses: actions/deploy-pages@v4
        id: deployment
