name: Alysha

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.0.0

options:
  bundleIdPrefix: com.aakashranga
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  swift: "6.0"

targets:
  Alysha:
    type: application
    platform: iOS
    sources:
      - Alysha
    info:
      path: Alysha/Info.plist
      properties:
        CFBundleDisplayName: Alysha
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - alysha
        NSCameraUsageDescription: "Alysha uses your camera to scan the QR code from your Mac setup."
        NSMicrophoneUsageDescription: "Alysha uses your microphone to record voice notes."
        LSApplicationQueriesSchemes:
          - obsidian
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - Newsreader.ttf
          - Newsreader-Italic.ttf
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      SWIFT_VERSION: 6.0
      IPHONEOS_DEPLOYMENT_TARGET: 17.0
      PRODUCT_BUNDLE_IDENTIFIER: com.aakashranga.Alysha

  AlyshWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - AlyshWidgetExtension
    settings:
      SWIFT_VERSION: 6.0
      PRODUCT_BUNDLE_IDENTIFIER: com.aakashranga.Alysha.widget
