name: Sol

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.0.0

options:
  bundleIdPrefix: com.aakashranga
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  swift: "6.0"

targets:
  Sol:
    type: application
    platform: iOS
    sources:
      - Sol
    info:
      path: Sol/Info.plist
      properties:
        CFBundleDisplayName: Sol
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - sol
        NSCameraUsageDescription: "Sol uses your camera to scan the QR code from your Mac setup."
        NSMicrophoneUsageDescription: "Sol uses your microphone to record voice notes."
        LSApplicationQueriesSchemes:
          - obsidian
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - Newsreader.ttf
          - Newsreader-Italic.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      SWIFT_VERSION: 6.0
      IPHONEOS_DEPLOYMENT_TARGET: 17.0
      PRODUCT_BUNDLE_IDENTIFIER: com.aakashranga.Sol
      DEVELOPMENT_TEAM: J6X383NXGF
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  SolWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - SolWidgetExtension
    settings:
      SWIFT_VERSION: 6.0
      PRODUCT_BUNDLE_IDENTIFIER: com.aakashranga.Sol.widget
      DEVELOPMENT_TEAM: J6X383NXGF
      CODE_SIGN_STYLE: Automatic

  SolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SolTests
    settings:
      SWIFT_VERSION: 6.0
      IPHONEOS_DEPLOYMENT_TARGET: 17.0
      PRODUCT_BUNDLE_IDENTIFIER: com.aakashranga.SolTests
      DEVELOPMENT_TEAM: J6X383NXGF
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Sol
